<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NBA Props Tracker</title>
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7;
  --surface-1: #fcfcfb;
  --text-primary: #0b0b0b;
  --text-secondary: #52514e;
  --muted: #898781;
  --grid: #e1e0d9;
  --axis: #c3c2b7;
  --border: rgba(11, 11, 11, 0.10);
  --wash: rgba(11, 11, 11, 0.04);
  --series-1: #2a78d6;
  --link: #2a78d6;
  --good: #0ca30c;
  --good-text: #006300;
  --warning: #fab219;
  --serious: #ec835a;
  --critical: #d03b3b;
  --font: system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0d0d0d;
    --surface-1: #1a1a19;
    --text-primary: #f0efec;
    --text-secondary: #c3c2b7;
    --grid: #2c2c2a;
    --axis: #383835;
    --border: rgba(255, 255, 255, 0.10);
    --wash: rgba(255, 255, 255, 0.05);
    --series-1: #3987e5;
    --link: #5598e7;
    --good-text: #0ca30c;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d;
  --surface-1: #1a1a19;
  --text-primary: #f0efec;
  --text-secondary: #c3c2b7;
  --grid: #2c2c2a;
  --axis: #383835;
  --border: rgba(255, 255, 255, 0.10);
  --wash: rgba(255, 255, 255, 0.05);
  --series-1: #3987e5;
  --link: #5598e7;
  --good-text: #0ca30c;
}
/* team logos: ESPN ships a dark-background variant */
.logo-dark { display: none; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .logo-light { display: none; } :root:not([data-theme="light"]) .logo-dark { display: block; } }
:root[data-theme="dark"] .logo-light { display: none; }
:root[data-theme="dark"] .logo-dark { display: block; }

* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--text-primary); font: 14px/1.45 var(--font); }
.wrap { max-width: 1180px; margin: 0 auto; padding: 20px 16px 48px; }
header.top { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline; justify-content: space-between; margin-bottom: 18px; }
h1 { font-size: 20px; margin: 0; font-weight: 650; }
h2 { font-size: 22px; margin: 0; font-weight: 650; letter-spacing: -0.01em; }
h3 { font-size: 14px; margin: 0; font-weight: 650; }
h4 { font-size: 13px; margin: 0 0 6px; font-weight: 650; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.04em; }
.sub { color: var(--text-secondary); }
.muted { color: var(--muted); }
section { margin-top: 32px; }
.card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; min-width: 0; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.spread { justify-content: space-between; }
button, input, select { font: inherit; color: var(--text-primary); background: var(--surface-1); border: 1px solid var(--border); border-radius: 7px; padding: 5px 10px; }
button { cursor: pointer; }
button:hover { background: var(--wash); }
button:disabled { opacity: 0.5; cursor: default; }
button.primary { border-color: var(--series-1); }
button.armed { background: var(--series-1); border-color: var(--series-1); color: #fff; }
a { color: var(--link); text-decoration: none; font-weight: 650; }
a:hover { text-decoration: underline; }
:focus-visible { outline: 2px solid var(--series-1); outline-offset: 2px; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 7px; overflow: hidden; }
.seg button { border: 0; border-radius: 0; }
.seg button[aria-pressed="true"] { background: var(--wash); font-weight: 650; }

/* ── games board ─────────────────────────────────────────────────────────── */
.board-head { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.board-head .day { font-weight: 650; min-width: 120px; text-align: center; }
.board {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
  gap: 1px; background: var(--border); border: 1px solid var(--border); border-radius: 10px; overflow: hidden;
}
.tile {
  all: unset; box-sizing: border-box; cursor: pointer; background: var(--surface-1);
  display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; padding: 14px 16px; min-width: 0;
}
.tile:hover { background: color-mix(in srgb, var(--surface-1) 94%, var(--text-primary)); }
.tile:focus-visible { outline: 2px solid var(--series-1); outline-offset: -2px; }
.side { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 12px; align-items: center; }
.side + .side { margin-top: 12px; }
.logo { width: 44px; height: 44px; object-fit: contain; }
.logo-fallback { width: 44px; height: 44px; border-radius: 50%; background: var(--wash); display: grid; place-items: center; font-weight: 700; font-size: 12px; color: var(--text-secondary); }
.big { font-size: 30px; font-weight: 650; line-height: 1.05; letter-spacing: -0.01em; }
.big.fav { color: var(--text-primary); }
.big.dog { color: var(--text-secondary); font-weight: 550; }
.big.none { color: var(--muted); font-weight: 500; }
.tname { color: var(--text-secondary); font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tname .rec { color: var(--muted); font-size: 13px; }
.mid { text-align: right; display: flex; flex-direction: column; justify-content: center; gap: 3px; white-space: nowrap; }
.mid .time { font-size: 20px; font-weight: 650; color: var(--text-primary); }
.mid .line { color: var(--text-secondary); }
.mid .small { color: var(--muted); font-size: 12px; }
.mid .src { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); }
.board-note { margin-top: 8px; }

/* ── game detail dialog ──────────────────────────────────────────────────── */
dialog#detail {
  width: min(980px, calc(100vw - 32px)); max-height: calc(100vh - 48px); padding: 0;
  background: var(--page); color: var(--text-primary); border: 1px solid var(--border); border-radius: 12px;
}
dialog#detail::backdrop { background: rgba(0, 0, 0, 0.55); }
.detail-head { position: sticky; top: 0; z-index: 2; background: var(--surface-1); border-bottom: 1px solid var(--border); padding: 14px 18px; display: flex; gap: 12px; align-items: center; justify-content: space-between; }
.detail-head .teams { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 18px; font-weight: 650; }
.detail-head .logo { width: 34px; height: 34px; }
.detail-body { padding: 16px 18px 22px; display: grid; gap: 14px; }
.detail-cols { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
.prob-row { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 10px; align-items: center; margin-top: 10px; }
.prob-row .lbl { color: var(--text-secondary); font-size: 13px; }
.split { display: flex; gap: 2px; height: 12px; }
.split span { display: block; height: 100%; }
.split .fav { background: var(--series-1); }
.split .dog { background: var(--axis); }
.split span:first-child { border-radius: 4px 0 0 4px; }
.split span:last-child { border-radius: 0 4px 4px 0; }
.split-labels { display: flex; justify-content: space-between; font-size: 13px; margin-top: 3px; font-variant-numeric: tabular-nums; }
.split-labels .f { font-weight: 650; }
.split-labels .d { color: var(--text-secondary); }
.best { display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
.pick { border: 1px solid var(--border); border-radius: 9px; padding: 10px 12px; background: var(--surface-1); }
.pick .who { font-weight: 650; }
.pick .bet { font-size: 18px; font-weight: 650; margin: 2px 0; }
.pick .stats { color: var(--text-secondary); font-size: 13px; }
.inj-list { list-style: none; margin: 0; padding: 0; }
.inj-list li { padding: 6px 0; border-bottom: 1px solid var(--grid); }
.inj-list li:last-child { border-bottom: 0; }
.inj-list .st { font-weight: 650; }
.inj-list .note { color: var(--text-secondary); font-size: 13px; }

/* ── shared bits ─────────────────────────────────────────────────────────── */
.chip { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; white-space: nowrap; }
.chip i { font-style: normal; width: 16px; height: 16px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 11px; font-weight: 700; color: #fff; }
.chip.good i { background: var(--good); }
.chip.warning i { background: var(--warning); color: #0b0b0b; }
.chip.critical i { background: var(--critical); }
.chip.neutral i { background: var(--axis); color: var(--text-primary); }
.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--grid); white-space: nowrap; }
th { color: var(--text-secondary); font-weight: 600; font-size: 12px; }
td.num, th.num { text-align: right; }
td.wrap { white-space: normal; min-width: 200px; color: var(--text-secondary); }
.res { font-weight: 650; }
.res.hit { color: var(--good-text); }
.res.miss { color: var(--critical); }
.res.push, .res.pending { color: var(--muted); }
.flags { color: var(--muted); font-size: 12px; }
.error { color: var(--critical); }
.empty { color: var(--muted); padding: 14px 0; }

/* ── performance ─────────────────────────────────────────────────────────── */
.kpis { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); margin-bottom: 12px; }
.kpi .label { color: var(--text-secondary); }
.kpi .value { font-size: 28px; font-weight: 650; margin-top: 2px; letter-spacing: -0.01em; }
.kpi .note { color: var(--muted); margin-top: 2px; }
.grid-2 { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); }
.chart-card header { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; margin-bottom: 8px; }
.chart { position: relative; }
.chart svg { display: block; width: 100%; overflow: visible; }
.chart svg text { font: 11px var(--font); fill: var(--muted); font-variant-numeric: tabular-nums; }
.chart svg text.value { fill: var(--text-secondary); font-weight: 600; }
.chart svg text.ref { fill: var(--text-secondary); }
.chart .mark { fill: var(--series-1); transition: opacity 120ms; }
.chart.hovering .mark { opacity: 0.55; }
.chart.hovering .mark.on { opacity: 1; }
.chart .hit { fill: transparent; }
.chart .hit:focus { outline: none; }
.chart .hit:focus-visible { stroke: var(--series-1); stroke-width: 2; }
.tip { position: absolute; pointer-events: none; display: none; z-index: 5; background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px; padding: 6px 9px; box-shadow: 0 4px 14px rgba(0, 0, 0, 0.12); white-space: nowrap; }
.tip strong { display: block; font-size: 14px; }
.tip span { color: var(--text-secondary); }

/* ── pipeline ────────────────────────────────────────────────────────────── */
.grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); }
.status-card .meta { margin: 8px 0 10px; color: var(--text-secondary); }
.status-card .meta div { margin-top: 2px; }
.job { margin-top: 10px; border-top: 1px solid var(--border); padding-top: 10px; }
.job pre { margin: 8px 0 0; max-height: 220px; overflow: auto; font-size: 12px; line-height: 1.4; background: var(--page); border: 1px solid var(--border); border-radius: 6px; padding: 8px; white-space: pre-wrap; word-break: break-word; }
@media (max-width: 420px) {
  .board { grid-template-columns: 1fr; }
  .big { font-size: 26px; }
  .mid .time { font-size: 17px; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>NBA Props Tracker</h1>
    <div class="row">
      <span class="muted" id="refreshed"></span>
      <button id="refresh" type="button">Refresh</button>
      <button id="theme" type="button">Theme: auto</button>
    </div>
  </header>

  <section aria-labelledby="h-games" style="margin-top:0">
    <div class="board-head">
      <h2 id="h-games">Games</h2>
      <div class="row">
        <button type="button" id="day-prev" aria-label="Previous day">‹</button>
        <span class="day" id="day-label"></span>
        <button type="button" id="day-next" aria-label="Next day">›</button>
        <button type="button" id="day-today">Today</button>
      </div>
      <a href="#performance">Model performance ▸</a>
    </div>
    <div id="board" class="board" aria-live="polite"></div>
    <div id="board-note" class="board-note muted"></div>
  </section>

  <section id="performance" aria-labelledby="h-perf">
    <div class="row spread" style="margin-bottom:12px">
      <h2 id="h-perf">Model performance</h2>
      <div class="seg" role="group" aria-label="Date range" id="range">
        <button type="button" data-range="7d">7 days</button>
        <button type="button" data-range="30d">30 days</button>
        <button type="button" data-range="season" aria-pressed="true">Season</button>
        <button type="button" data-range="all">All</button>
      </div>
    </div>
    <div class="kpis" id="kpis"></div>
    <div class="grid-2">
      <div class="card chart-card" id="card-daily"></div>
      <div class="card chart-card" id="card-market"></div>
      <div class="card chart-card" id="card-side"></div>
    </div>
  </section>

  <section aria-labelledby="h-pipeline">
    <h2 id="h-pipeline" style="margin-bottom:12px">Pipeline</h2>
    <div class="grid" id="status-cards"></div>
    <div class="card table-wrap" id="schedule" style="margin-top:12px"></div>
    <details class="card" style="margin-top:12px">
      <summary><h3 style="display:inline">Recent runs</h3></summary>
      <div class="table-wrap" id="runs" style="margin-top:8px"></div>
    </details>
  </section>
</div>

<dialog id="detail" aria-labelledby="detail-title"></dialog>

<script>
"use strict";
const $ = (s) => document.querySelector(s);
const SVG = "http://www.w3.org/2000/svg";

function el(tag, props = {}, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (v === undefined || v === null || v === false) continue;
    if (k === "class") n.className = v;
    else if (k === "text") n.textContent = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) {
    if (kid === null || kid === undefined || kid === false) continue;
    n.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  }
  return n;
}
function svg(tag, attrs = {}, text) {
  const n = document.createElementNS(SVG, tag);
  for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
  if (text !== undefined) n.textContent = text;
  return n;
}
async function api(path, opts) {
  const r = await fetch(path, { cache: "no-store", ...opts });
  const body = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(body.error || `HTTP ${r.status}`);
  return body;
}

// ── formatting ───────────────────────────────────────────────────────────────
const pct = (x, d = 1) => (x === null || x === undefined ? "—" : `${(x * 100).toFixed(d)}%`);
const num = (x, d = 1) => (x === null || x === undefined || x === "" ? "—" : Number(x).toFixed(d));
const record = (r) => `${r.hits}–${r.misses}${r.pushes ? `–${r.pushes}` : ""}`;
const localFmt = new Intl.DateTimeFormat(undefined, { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
const timeFmt = new Intl.DateTimeFormat(undefined, { hour: "numeric", minute: "2-digit" });
const etFmt = new Intl.DateTimeFormat(undefined, { hour: "numeric", minute: "2-digit", timeZone: "America/New_York" });
const dayFmt = new Intl.DateTimeFormat(undefined, { month: "short", day: "numeric", timeZone: "UTC" });
const longDayFmt = new Intl.DateTimeFormat(undefined, { weekday: "short", month: "short", day: "numeric", timeZone: "UTC" });
const when = (iso) => (iso ? localFmt.format(new Date(iso)) : "—");
const whenEt = (iso) => (iso ? `${etFmt.format(new Date(iso))} ET` : "");
const shortDay = (d) => dayFmt.format(new Date(`${d}T12:00:00Z`));
const longDay = (d) => longDayFmt.format(new Date(`${d}T12:00:00Z`));
function ago(iso) {
  if (!iso) return "";
  const m = Math.round((Date.now() - new Date(iso)) / 60000);
  if (m < 1) return "just now";
  if (m < 60) return `${m} min ago`;
  const h = Math.round(m / 60);
  return h < 48 ? `${h} h ago` : `${Math.round(h / 24)} days ago`;
}
function shiftDay(iso, days) {
  const d = new Date(`${iso}T12:00:00Z`);
  d.setUTCDate(d.getUTCDate() + days);
  return d.toISOString().slice(0, 10);
}
const STATUS = {
  ok: ["good", "✓", "OK"], partial: ["warning", "!", "Partial"], fetch_failed: ["critical", "✕", "Failed"],
  no_games: ["neutral", "–", "No games"], skipped: ["neutral", "–", "Skipped"],
  market_unavailable: ["neutral", "–", "No lines"], running: ["neutral", "…", "Running"],
};
function chip(status) {
  const [cls, icon, label] = STATUS[status] || ["neutral", "?", status || "Never run"];
  return el("span", { class: `chip ${cls}` }, el("i", { "aria-hidden": "true", text: icon }), label);
}
const EXIT = { 0: "ok", 2: "fetch_failed", 3: "partial" };
function resultText(result) {
  if (!result) return el("span", { class: "res pending", text: "—" });
  const cls = { HIT: "hit", MISS: "miss", PUSH: "push" }[result] || "pending";
  const icon = { HIT: "✓ ", MISS: "✕ ", PUSH: "= " }[result] || "";
  return el("span", { class: `res ${cls}`, text: `${icon}${result}` });
}
const odds = (o) => (o === null || o === undefined ? "—" : o > 0 ? `+${Math.round(o)}` : `${Math.round(o)}`);

const state = { today: null, day: null, range: "season", overview: null, perf: null, games: null, open: null };

// ── games board ──────────────────────────────────────────────────────────────
function logo(team, cls = "logo") {
  if (!team.logo) return el("div", { class: "logo-fallback", "aria-hidden": "true", text: team.abbr });
  return el("div", { class: cls },
    el("img", { class: `${cls} logo-light`, src: team.logo, alt: "", loading: "lazy" }),
    el("img", { class: `${cls} logo-dark`, src: team.logo_dark || team.logo, alt: "", loading: "lazy" }));
}
function lineText(g) {
  const m = g.model;
  if (m && m.spread_pick && m.spread !== null && m.spread !== undefined) {
    const pts = Math.abs(Number(m.spread));
    return { text: pts < 0.5 ? `${m.spread_pick} pick'em` : `${m.spread_pick} by ${num(pts)}`, src: "model" };
  }
  return g.line ? { text: g.line, src: "book" } : null;
}
function sideRow(g, side) {
  const team = g[side];
  const prob = g.win ? g.win[`${side}_prob`] : null;
  const other = g.win ? g.win[`${side === "home" ? "away" : "home"}_prob`] : null;
  const hasProb = prob !== null && prob !== undefined;
  const scored = g.state !== "pre" && team.score !== null && team.score !== undefined;
  // The win % is the headline in every state; the score rides next to the name once play starts.
  const big = hasProb ? el("div", { class: `big ${prob >= other ? "fav" : "dog"}`, text: pct(prob, 0) })
    : el("div", { class: "big none", text: team.record || "—" });
  const detail = scored ? el("span", { class: "rec", style: team.winner ? "color:var(--text-primary);font-weight:650" : null, text: ` · ${team.score}` })
    : hasProb && team.record ? el("span", { class: "rec", text: ` · ${team.record}` }) : null;
  return el("div", { class: "side" }, logo(team),
    el("div", {}, big, el("div", { class: "tname" }, team.short, detail)));
}
function tile(g) {
  const ln = lineText(g);
  const h = g.h2h;
  let h2h = "H2H —";
  if (h && h.count) {
    const [[lead, lw], [, tw]] = Object.entries(h.wins).sort((a, b) => b[1] - a[1]);
    h2h = lw === tw ? `H2H even ${lw}–${tw} · last ${h.count}` : `H2H ${lead} ${lw}–${tw} · last ${h.count}`;
  }
  const inj = (g.away.injuries?.out || 0) + (g.home.injuries?.out || 0);
  const bits = [g.props.count ? `${g.props.count} picks` : null, inj ? `${inj} out` : null].filter(Boolean).join(" · ");
  const timeLabel = g.state === "pre" ? (g.start_utc ? timeFmt.format(new Date(g.start_utc)) : "TBD") : (g.status_text || (g.state === "post" ? "Final" : "Live"));
  const src = g.win ? (g.win.source === "Model" ? "Model win %" : "Market win %") : "No model % yet";
  const b = el("button", { type: "button", class: "tile", "data-key": g.key,
    "aria-label": `${g.away.name} at ${g.home.name}, ${timeLabel}. Open predictions` },
    el("div", {}, sideRow(g, "away"), sideRow(g, "home")),
    el("div", { class: "mid" },
      el("div", { class: "time", text: timeLabel }),
      g.final && g.final.winner_hit ? el("div", {}, el("span", { class: "small", text: "Model pick " }), resultText(g.final.winner_hit)) : null,
      ln ? el("div", { class: "line", text: ln.text }) : null,
      el("div", { class: "small", text: h2h }),
      bits ? el("div", { class: "small", text: bits }) : null,
      el("div", { class: "src", text: src })));
  b.addEventListener("click", () => openGame(g.key));
  return b;
}
function renderBoard() {
  const data = state.games;

  if (!data.games.length) {

    } else meta.append(el("div", { text: "No runs logged yet" }));
    if (agent && agent.next_local) meta.append(el("div", { text: `Next: ${when(agent.next_local)} (${whenEt(agent.next_et)})${agent.pid ? " · running now" : ""}` }));
    else if (c.agent && !agent) meta.append(el("div", { class: "muted", text: "Not scheduled" }));
    const actions = el("div", { class: "row" });
    let dateInput = null;
    if (c.date) { dateInput = el("input", { type: "date", value: shiftDay(today_et, -1), "aria-label": "Date to grade" }); actions.append(dateInput); }
    if (c.run) actions.append(armedButton(c.run, (b) => startJob(c.job, b, dateInput ? { date: dateInput.value } : {})));
    const jobBox = el("div", { class: "job" });
    if (job && job.state !== "idle") {
      const running = job.state === "running";
      jobBox.append(el("div", { class: "row" }, chip(running ? "running" : EXIT[job.exit_code] || "fetch_failed"),
        el("span", { class: "muted", text: running ? `started ${when(job.started_at)}` : `exit ${job.exit_code} · started ${when(job.started_at)}` })));
      jobBox.append(el("details", { open: running || null }, el("summary", { text: "Log" }), el("pre", { text: (job.log_tail || []).join("\n") || "(no output yet)" })));
    } else jobBox.hidden = true;
    return el("div", { class: "card status-card", "data-job": c.job },
      el("div", { class: "row spread" }, el("h3", { text: c.title }), chip(last ? last.status : null)), meta, actions, jobBox);
  }));
  const rows = agents.map((a) => el("tr", {},
    el("td", { text: a.name }),
    el("td", { text: a.keep_alive ? "Always on" : a.local_times.join(", ") }),
    el("td", { text: a.next_local ? `${when(a.next_local)} (${whenEt(a.next_et)})` : "—" }),
    el("td", {}, a.pid ? chip("running") : a.loaded ? (a.last_exit === null ? "—" : chip(EXIT[a.last_exit] || "fetch_failed")) : el("span", { class: "muted", text: "not loaded" }))));
  $("#schedule").replaceChildren(agents.length ? el("table", {},
    el("thead", {}, el("tr", {}, ["Schedule", "Runs at (local)", "Next run", "Last exit"].map((h) => el("th", { text: h })))),
    el("tbody", {}, rows)) : el("div", { class: "empty", text: "No launchd agents installed. Run: python3 scripts/launchd_agents.py install" }));
}
async function loadRuns() {
  try {
    const rows = await api("/api/runs?limit=40");
    $("#runs").replaceChildren(el("table", {},
      el("thead", {}, el("tr", {}, ["Started", "Command", "Slate", "Status", "Picks", "Problems"].map((h, i) => el("th", { class: i === 4 ? "num" : null, text: h })))),
      el("tbody", {}, rows.map((r) => el("tr", {},
        el("td", { text: when(r.started_at) }), el("td", { text: r.command }),
        el("td", { text: r.slate_date ? shortDay(r.slate_date) : "—" }), el("td", {}, chip(r.status)),
        el("td", { class: "num", text: r.picks ?? "—" }),
        el("td", { class: "wrap", text: r.failed.map((f) => `${f.stage}${f.detail ? ` (${f.detail})` : ""}${f.required ? "" : " · optional"}`).join("; ") }))))));
  } catch (err) {
    $("#runs").replaceChildren(el("div", { class: "error", text: err.message }));
  }
}

// ── refresh loop ─────────────────────────────────────────────────────────────
let pollTimer = null;
async function loadOverview() {
  try {
    state.overview = await api("/api/overview");
    const first = state.today === null;
    state.today = state.overview.today_et;
    if (first) { state.day = state.today; loadGames(); }
    renderStatus();
    $("#refreshed").textContent = `Updated ${new Date().toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" })}`;
    const busy = Object.values(state.overview.jobs).some((j) => j.state === "running");
    clearTimeout(pollTimer);
    pollTimer = setTimeout(() => (busy ? loadOverview() : refreshAll()), busy ? 3000 : 60000);
    if (!busy && state._wasBusy) refreshAll(false);
    state._wasBusy = busy;
  } catch (err) {
    $("#refreshed").replaceChildren(el("span", { class: "error", text: `Dashboard server unreachable: ${err.message}` }));
    clearTimeout(pollTimer);
    pollTimer = setTimeout(loadOverview, 10000);
  }
}
function refreshAll(withOverview = true) {
  if (withOverview) loadOverview();
  if (state.day) loadGames();
  loadPerformance();
  loadRuns();
}
function setDay(day) { state.day = day; loadGames(); }
$("#refresh").addEventListener("click", () => refreshAll());
$("#day-prev").addEventListener("click", () => setDay(shiftDay(state.day, -1)));
$("#day-next").addEventListener("click", () => setDay(shiftDay(state.day, 1)));
$("#day-today").addEventListener("click", () => setDay(state.today));
document.querySelectorAll("#range button").forEach((b) => b.addEventListener("click", () => { state.range = b.dataset.range; loadPerformance(); }));

const THEMES = ["auto", "light", "dark"];
function applyTheme(t) {
  if (t === "auto") delete document.documentElement.dataset.theme;
  else document.documentElement.dataset.theme = t;
  $("#theme").textContent = `Theme: ${t}`;
  try { localStorage.setItem("nba-dash-theme", t); } catch (e) { /* storage unavailable */ }
}
$("#theme").addEventListener("click", () => applyTheme(THEMES[(THEMES.indexOf(document.documentElement.dataset.theme || "auto") + 1) % THEMES.length]));
try { const saved = localStorage.getItem("nba-dash-theme"); if (saved && THEMES.includes(saved)) applyTheme(saved); } catch (e) { /* ignore */ }

refreshAll();
</script>
</body>
</html>
