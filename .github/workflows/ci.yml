name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    # Pinned: ubuntu-latest became Ubuntu 26.04 on Oct 19 2026, which has no Python 3.9
    # build, so "Set up Python" failed before any test ran.
    runs-on: ubuntu-24.04
    # v10: the season rolls over every Oct 1 and changes which fitted artifacts
    # are active, so the suite must pass for the last completed season and the
    # live one.
    strategy:
      fail-fast: false
      matrix:
        nba-season: ["2025-26", "2026-27"]
    env:
      NBA_SEASON: ${{ matrix.nba-season }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # The local Mac runs 3.9.6, which hosted runners no longer offer (Ubuntu 18.04
          # and 20.04 only); the latest 3.9 keeps the same language level.
          python-version: "3.9"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests (NBA_SEASON=${{ matrix.nba-season }})
        run: python -m pytest tests/ -v --tb=short --cov=. --cov-report=term-missing --cov-fail-under=35
