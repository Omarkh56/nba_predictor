name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest
    # v10: the season rolls over every Oct 1 and changes which fitted artifacts
    # are active, so the suite must pass for the last completed season and the
    # live one.
    strategy:
      fail-fast: false
      matrix:
        nba-season: ["2025-26", "2026-27"]
    env:
      NBA_SEASON: ${{ matrix.nba-season }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests (NBA_SEASON=${{ matrix.nba-season }})
        run: python -m pytest tests/ -v --tb=short --cov=. --cov-report=term-missing --cov-fail-under=35
